name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows: the read-only test parses the collector with Windows PowerShell.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Pinned to commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # One command per step: a PowerShell step fails only on the exit code of its last command.
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        # The live collector test needs LEXSHIELD_LIVE=1 and is skipped here.
        run: pytest -q
