[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lexshield"
dynamic = ["version"]
description = "Read-only Windows security audit for Swiss law firms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lulzis" }]
keywords = ["security", "audit", "windows", "law firm", "switzerland", "data protection"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: System Administrators",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/lulzis/lexshield"
Issues = "https://github.com/lulzis/lexshield/issues"
Changelog = "https://github.com/lulzis/lexshield/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ruff is pinned so that CI checks the same formatting as a local run.
dev = ["pytest>=8", "ruff==0.17.3"]

[project.scripts]
lexshield = "lexshield.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lexshield.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexshield = ["data/*.toml", "collect.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
